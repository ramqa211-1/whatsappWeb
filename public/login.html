<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Python Scraper - Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #0077b5 0%, #005885 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .form-section {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0077b5;
        }
        
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-container input[type="password"],
        .password-container input[type="text"] {
            flex: 1;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        
        .password-toggle {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-left: none;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 50px;
        }
        
        .password-toggle:hover {
            background: #e9ecef;
            border-color: #0077b5;
        }
        
        .password-toggle:focus {
            outline: none;
            border-color: #0077b5;
            box-shadow: 0 0 0 3px rgba(0,119,181,0.1);
        }
        
        .btn {
            background: linear-gradient(135deg, #0077b5 0%, #005885 100%);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,119,181,0.3);
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐍 LinkedIn Python Scraper</h1>
            <p>התחברות למערכת</p>
        </div>
        
        <div class="form-section">
            <div class="error" id="errorMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">👤 שם משתמש:</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="הזן שם משתמש">
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 סיסמה:</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required 
                               placeholder="הזן סיסמה">
                        <button type="button" class="password-toggle" id="passwordToggle" title="הצג/הסתר סיסמה">
                            👁️
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    🚀 התחבר
                </button>
            </form>
        </div>
        
        <div class="footer">
            <p>🔒 המערכת מוגנת בסיסמה</p>
        </div>
    </div>

    <script>
        // פונקציונליות הצגה/הסתרה של הסיסמה
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        
        if (passwordToggle && passwordInput) {
            passwordToggle.addEventListener('click', function() {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    passwordToggle.textContent = '🙈';
                    passwordToggle.title = 'הסתר סיסמה';
                } else {
                    passwordInput.type = 'password';
                    passwordToggle.textContent = '👁️';
                    passwordToggle.title = 'הצג סיסמה';
                }
            });
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // בדיקת פרטי התחברות
            if (username === 'ADMIN' && password === '2918') {
                // התחברות הצליחה - שמור ב-session
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', username);
                
                // מעבר לעמוד הראשי
                window.location.href = '/';
            } else {
                // שגיאה בהתחברות
                errorMessage.style.display = 'block';
                errorMessage.textContent = 'שם משתמש או סיסמה שגויים';
            }
        });
        
        // בדיקה אם המשתמש כבר מחובר
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = '/';
        }
    </script>
</body>
</html>
